name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: server (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tagmonitor
          POSTGRES_PASSWORD: tagmonitor
          POSTGRES_DB: tagmonitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tagmonitor"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://tagmonitor:tagmonitor@localhost:5432/tagmonitor
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest

  web:
    name: web (eslint, tsc, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
