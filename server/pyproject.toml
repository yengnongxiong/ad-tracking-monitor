[project]
name = "tagmonitor"
version = "0.1.0"
description = "Ad tracking and landing page monitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "psycopg[binary,pool]>=3.3.6",
    "playwright==1.63.0",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "tldextract>=5.3.2",
    "boto3>=1.43.104",
    "argon2-cffi>=25.1.0",
    "pandas>=3.0.6",
    "matplotlib>=3.11.2",
    "anthropic>=1.9.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.104",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle + pyflakes
    "I",            # import sorting
    "UP",           # modern syntax
    "B",            # likely bugs
    "SIM",          # simplifications
    "ASYNC",        # blocking calls inside async code
    "S",            # security (e.g. S608 flags SQL built from strings)
    "RUF",
]
# Asserts state internal invariants (mostly for type narrowing); we never run with -O, and
# security-relevant checks always raise explicit exceptions instead.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# The SSRF tests list addresses like 0.0.0.0 as data, not as bind addresses; tests use
# seeded `random` for reproducible jitter checks and throwaway passwords.
"tests/**" = ["S104", "S105", "S106", "S311"]


[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
